name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  dashboard:
    name: Dashboard · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=2048

  windows:
    name: Windows 11 · setup + pytest + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
      - name: Run Windows setup script
        shell: pwsh
        run: ./windows/setup.ps1
      - name: Engine tests on Windows
        shell: pwsh
        working-directory: engine
        run: |
          & ../engine/.venv/Scripts/python.exe -m pytest -q
      - name: Dashboard lint and build on Windows
        shell: pwsh
        working-directory: dashboard
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          npm run lint
          npm run build
