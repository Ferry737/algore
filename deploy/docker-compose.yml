services:
  algore-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: algore-engine:local
    container_name: algore-api
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
